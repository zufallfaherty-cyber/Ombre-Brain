services:
  - type: web
    name: ombre-brain
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python src/server.py
    envVars:
      - key: OMBRE_TRANSPORT
        value: streamable-http
      - key: OMBRE_MCP_REQUIRE_AUTH
        value: "false"
      - key: OMBRE_EMBED_BACKEND
        value: api
      - key: OMBRE_EMBED_API_KEY
        sync: false
      - key: OMBRE_EMBED_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OMBRE_EMBED_MODEL
        value: text-embedding-004
      - key: OMBRE_COMPRESS_API_KEY
        sync: false
      - key: OMBRE_COMPRESS_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OMBRE_COMPRESS_MODEL
        value: gemini-2.5-flash-lite
      - key: OMBRE_BUCKETS_DIR
        value: /opt/render/project/src/buckets
    disk:
      name: ombre-buckets
      mountPath: /opt/render/project/src/buckets
      sizeGB: 1
